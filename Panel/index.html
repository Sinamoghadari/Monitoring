<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پنل مدیریت مانیتورینگ</title>
    <!-- <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> -->
    <style>
        body { font-family: Tahoma, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .container { display: flex; gap: 20px; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; }
        textarea { width: 100%; height: 300px; direction: ltr; font-family: monospace; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px;}
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h1>پنل مدیریت سیستم مانیتورینگ</h1>
    
    <div class="container">
        <!-- بخش تنظیمات Postgres -->
        <div class="box">
            <h2>تنظیمات سیستم (PostgreSQL)</h2>
            <textarea id="settingsInput"></textarea>
            <br>
            <button onclick="saveSettings()">ذخیره تنظیمات جدید</button>
            <p id="statusMsg" style="color: green; font-weight: bold;"></p>
        </div>

        <!-- بخش نمودار ClickHouse -->
        <div class="box">
            <h2>نمودار لاگ‌ها (ClickHouse)</h2>
            <canvas id="logsChart"></canvas>
        </div>
    </div>

    <script>
        // آدرس سرور FastAPI شما
        const apiUrl = 'http://localhost:8000';

        async function loadSettings() {
            try {
                const response = await fetch(`${apiUrl}/api/settings`);
                const data = await response.json();
                document.getElementById('settingsInput').value = JSON.stringify(data, null, 2);
            } catch (error) {
                console.error('Error loading settings:', error);
            }
        }

        async function saveSettings() {
            try {
                const jsonText = document.getElementById('settingsInput').value;
                const jsonData = JSON.parse(jsonText); 

                const response = await fetch(`${apiUrl}/api/settings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(jsonData)
                });

                if (response.ok) {
                    document.getElementById('statusMsg').innerText = 'تنظیمات با موفقیت ذخیره شد!';
                    setTimeout(() => document.getElementById('statusMsg').innerText = '', 3000);
                }
            } catch (error) {
                alert('خطا در ذخیره‌سازی. بررسی کنید فرمت JSON صحیح باشد.\n' + error);
            }
        }

        async function loadLogsChart() {
            try {
                const response = await fetch(`${apiUrl}/api/logs-chart`);
                const data = await response.json();

                const labels = data.map(item => item.LogLevel);
                const counts = data.map(item => item.Count);

                const ctx = document.getElementById('logsChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'تعداد لاگ‌ها',
                            data: counts,
                            backgroundColor: ['#ff6384', '#36a2eb', '#ffce56', '#4bc0c0', '#9966ff']
                        }]
                    }
                });
            } catch (error) {
                console.error('Error loading chart:', error);
            }
        }

        window.onload = () => {
            loadSettings();
            loadLogsChart();
        };
    </script>
</body>
</html>
